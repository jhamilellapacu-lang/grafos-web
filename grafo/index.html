<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Prueba Nodo</title>
</head>
<body>

<h2>Si haces clic debe aparecer un círculo</h2>

<div id="area" style="width:500px;height:300px;border:3px solid red;"></div>

<script>
  const area = document.getElementById("area");

  area.addEventListener("click", function(e) {

    const nodo = document.createElement("div");
    nodo.style.width = "30px";
    nodo.style.height = "30px";
    nodo.style.borderRadius = "50%";
    nodo.style.background = "green";
    nodo.style.position = "absolute";

    nodo.style.left = e.pageX + "px";
    nodo.style.top = e.pageY + "px";

    document.body.appendChild(nodo);

  });
</script>

</body>
</html>
